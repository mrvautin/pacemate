<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C81E3A"/>
      <stop offset="50%" stop-color="#E8480C"/>
      <stop offset="100%" stop-color="#F78F0E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE29A"/>
      <stop offset="100%" stop-color="#FFF3C4"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded square, standard app-icon shape -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Pace/target dial rings -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="8"/>
  <circle cx="256" cy="256" r="164" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="14"/>
  <path d="M 256 92 A 164 164 0 0 1 402 322" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>

  <!-- Runner pictogram: bold rounded-capsule limbs, built like an Olympic-style running figure -->
  <g transform="translate(246,266)" fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- back leg: hip -> knee -> back foot -->
    <path d="M -6,-16 L -38,10 L -66,34"/>
    <!-- front leg: hip -> knee -> front foot (knee driving up and forward) -->
    <path d="M -6,-16 L 22,-4 L 20,32"/>
    <!-- torso: hip to shoulder -->
    <path d="M -6,-16 L 4,-62"/>
    <!-- back arm: shoulder -> elbow -> hand (swings back) -->
    <path d="M 4,-62 L -26,-50 L -44,-64"/>
    <!-- front arm: shoulder -> elbow -> hand (drives forward) -->
    <path d="M 4,-62 L 34,-58 L 50,-38"/>
  </g>
  <!-- head, drawn solid on top -->
  <circle cx="250" cy="186" r="22" fill="#FFFFFF"/>

  <!-- speed lines trailing behind -->
  <g stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="10" stroke-linecap="round">
    <line x1="118" y1="238" x2="158" y2="238"/>
    <line x1="106" y1="264" x2="146" y2="264"/>
    <line x1="122" y1="290" x2="152" y2="290"/>
  </g>
</svg>
